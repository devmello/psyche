<!doctype html>
<html><head><meta charset="utf-8"><title>AXSnap Form</title>
<style>body{font:14px system-ui;margin:24px} label{display:block;margin:10px 0} #out{margin-top:16px;color:#060}</style></head>
<body>
<h1>Trip request</h1>
<form id="f">
  <label>Full name <input id="name" name="name" placeholder="Jane Doe"></label>
  <label>Email <input id="email" type="email" name="email" placeholder="jane@example.com"></label>
  <label>Destination
    <select id="dest" name="dest"><option>Lisbon</option><option>Kyoto</option><option>Oaxaca</option></select></label>
  <label><input id="window" type="checkbox" name="window"> Window seat</label>
  <label>Notes <textarea id="notes" name="notes" rows="3"></textarea></label>
  <div role="button" tabindex="0" id="fancy" onclick="console.log('fancy clicked')">Custom div button</div>
  <button type="submit">Submit request</button>
</form>
<div id="out" role="status"></div>
<script>
// Controlled-input frameworks (React) only see edits that fire input events.
document.addEventListener('input', e => console.log('INPUT ' + e.target.id));
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  d.window = document.getElementById('window').checked;
  const s = JSON.stringify(d);
  document.getElementById('out').textContent = 'Submitted: ' + s;
  console.log('SUBMIT ' + s);
});
</script>
</body></html>
