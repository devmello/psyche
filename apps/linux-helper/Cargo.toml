[workspace]
resolver = "2"
members = ["crates/protocol", "crates/helper", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.80"

# The helper is tiny and idle most of the time; favour size and RAM over build time.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
