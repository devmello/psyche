[package]
name = "psyche-helper"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Psyche Linux helper: a node that speaks the Psyche node protocol over the Gateway's node socket"

[[bin]]
name = "psyche-helper"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
jpeg-encoder = "0.7.1"
libc = "0.2"
psyche-protocol = { version = "0.1.0", path = "../protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
webpki-roots = "1.0.12"
x11rb = { version = "0.14.0", features = ["res", "shm", "xtest"] }
x11rb-protocol = "0.14.0"
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "3.27.0"
x509-parser = "0.18.1"
