[package]
name = "psyche-linux-computer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Psyche Linux helper: direct computer use (AT-SPI snapshots and actions, X11 and Wayland input and capture)"

[lib]
name = "psyche_linux_computer"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Grapheme counts, so truncation (`...(+N)`) and typing chunks match Swift's `String.count`.
unicode-segmentation = "1"
jpeg-encoder = "0.6"

[features]
fake = []

[dev-dependencies]
tempfile = "3.27.0"
