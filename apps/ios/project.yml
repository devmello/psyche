# XcodeGen spec for the Psyche iOS app (docs/design/ios-app-2026.md A10). The project is generated:
#   pnpm ios:project        (from the repo root; needs `brew install xcodegen`)
# All logic lives in the Swift package next to this file; the targets below are thin shells.
name: Psyche
options:
  bundleIdPrefix: com.psyche
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES

packages:
  PsycheKit:
    path: .

schemes:
  Psyche:
    build:
      targets:
        Psyche: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Psyche:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PsycheKit
        product: PsycheFeatures
      - package: PsycheKit
        product: PsycheDesign
      - target: NotificationService
      - target: Share
      - target: Widgets
      - target: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PSYCHE_BUNDLE_ID)
        PRODUCT_NAME: Psyche
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Psyche-Info.plist
      properties:
        CFBundleDisplayName: Psyche
        PsycheAppGroup: $(PSYCHE_APP_GROUP)
        NSCameraUsageDescription: Psyche uses the camera to read the pairing code shown on your Mac, to scan documents, and to attach photos you take to a message.
        NSMicrophoneUsageDescription: Psyche listens only while you dictate a message, and the speech is turned into text on this iPhone.
        NSSpeechRecognitionUsageDescription: Psyche turns your dictation into text, on this iPhone when your language supports it.
        NSFaceIDUsageDescription: Psyche asks for Face ID before it allows a payment or another sensitive action from your phone.
        LSApplicationQueriesSchemes: [tailscale]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: psyche
            CFBundleURLSchemes: [psyche]
    entitlements:
      path: Generated/Psyche.entitlements
      properties:
        com.apple.security.application-groups: [$(PSYCHE_APP_GROUP)]

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/NotificationService
    dependencies:
      - package: PsycheKit
        product: PsycheShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PSYCHE_BUNDLE_ID).notifications
        SKIP_INSTALL: YES
    info:
      path: Generated/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Psyche Notifications
        PsycheAppGroup: $(PSYCHE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Generated/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(PSYCHE_APP_GROUP)]

  Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
    dependencies:
      - package: PsycheKit
        product: PsycheShared
      - package: PsycheKit
        product: PsycheDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PSYCHE_BUNDLE_ID).share
        SKIP_INSTALL: YES
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: Psyche
        PsycheAppGroup: $(PSYCHE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: Generated/Share.entitlements
      properties:
        com.apple.security.application-groups: [$(PSYCHE_APP_GROUP)]

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widgets
    dependencies:
      - package: PsycheKit
        product: PsycheShared
      - package: PsycheKit
        product: PsycheDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PSYCHE_BUNDLE_ID).widgets
        SKIP_INSTALL: YES
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Psyche Widgets
        PsycheAppGroup: $(PSYCHE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(PSYCHE_APP_GROUP)]

  Intents:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Intents
    dependencies:
      - package: PsycheKit
        product: PsycheShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PSYCHE_BUNDLE_ID).intents
        # The target is named Intents, but a module of that name clashes with Apple's Intents framework.
        PRODUCT_MODULE_NAME: PsycheIntents
        SKIP_INSTALL: YES
    info:
      path: Generated/Intents-Info.plist
      properties:
        CFBundleDisplayName: Psyche Intents
        PsycheAppGroup: $(PSYCHE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.appintents-extension
    entitlements:
      path: Generated/Intents.entitlements
      properties:
        com.apple.security.application-groups: [$(PSYCHE_APP_GROUP)]
