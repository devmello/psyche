[package]
name = "psyche-win-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Psyche Helper for Windows: the Windows node (named-pipe node protocol, toasts, Windows Hello, Credential Manager, OCR)"

[workspace]
members = [".", "crates/win-computer", "crates/win-dictation", "crates/win-vm"]
default-members = [".", "crates/win-computer", "crates/win-dictation", "crates/win-vm"]
resolver = "3"

[[bin]]
name = "psyche-helper"
path = "src/main.rs"

[lib]
name = "psyche_win_helper"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
serde_path_to_error = "=0.1.20"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
ed25519-dalek = "=2.2.0"
sha2 = "=0.10.9"
base64 = "=0.22.1"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
hkdf = "=0.12.4"
aes-gcm = "=0.10.3"
zeroize = "=1.8.2"
windows-core = "=0.62.2"
windows-future = "=0.3.2"
psyche-win-computer = { path = "crates/win-computer" }
psyche-win-dictation = { path = "crates/win-dictation" }

[dev-dependencies]
# Paused clocks for the teach-mode timer test.
tokio = { version = "=1.49.0", features = ["test-util"] }

[dependencies.windows]
version = "=0.62.2"
features = [
  "Foundation",
  "Foundation_Collections",
  "Data_Xml_Dom",
  "UI_Notifications",
  "Security_Credentials",
  "Security_Credentials_UI",
  "Security_Cryptography",
  "Security_Cryptography_Core",
  "Storage",
  "Storage_Streams",
  "Graphics_Imaging",
  "Media_Ocr",
  "Globalization",
  "Win32_Globalization",
  "Data_Pdf",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_Time",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WinRT",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Notifications",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
]

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
