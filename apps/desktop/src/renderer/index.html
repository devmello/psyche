<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Psyche</title>
    <!--
      Static skeleton (docs/design/lightweight-2026.md item 2): what a rebuilt main window shows
      before the app's scripts run, in the default theme's canvas and sidebar colours. React
      replaces it when it mounts.
    -->
    <style>
      html:has(.sk), body:has(.sk) { margin: 0; height: 100%; background: #fcfcfe; }
      .sk { display: flex; height: 100vh; --sk-side: oklch(0.982 0.0038 288.03);
        --sk-line: oklch(0.884 0.0086 288.03); --sk-block: oklch(0.956 0.0054 288.03); }
      .sk-side { width: 248px; flex: none; background: var(--sk-side);
        box-shadow: inset -0.5px 0 0 var(--sk-line); padding: 64px 16px 0; box-sizing: border-box; }
      .sk-main { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
        padding: 0 10% 24px; }
      .sk-row { height: 12px; border-radius: 6px; background: var(--sk-block); margin: 0 0 14px; }
      .sk-composer { height: 52px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--sk-line); }
      @media (prefers-color-scheme: dark) {
        html:has(.sk), body:has(.sk) { background: #111112; }
        .sk { --sk-side: oklch(0.213 0.0038 288.03); --sk-line: oklch(0.348 0.0086 288.03);
          --sk-block: oklch(0.252 0.0054 288.03); }
      }
      @media (max-width: 719px) { .sk-side { display: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="sk" aria-hidden="true">
      <div class="sk-side">
        <div class="sk-row" style="width: 60%"></div><div class="sk-row" style="width: 70%"></div>
        <div class="sk-row" style="width: 55%"></div><div class="sk-row" style="width: 65%"></div>
      </div>
      <div class="sk-main"><div class="sk-composer"></div></div>
    </div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
