<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The separate desktop's session bus. The stock session.conf adds the standard session service
  folders, which include $XDG_DATA_HOME/dbus-1/services, and that is under /workspace: a task could
  plant a .service file there whose Exec= runs an interpreter on a script (noexec does not stop
  that), and this daemon would start it on request. So this file lists the image's own service
  folder only, and nothing from the user's home, the environment or /etc/dbus-1. The address is
  given on the command line (it replaces the <listen> below, which the daemon insists on).
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>

  <servicedir>/usr/share/dbus-1/services</servicedir>

  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
