# Psyche on a Linux server (topologies C and D, architecture §3.2; feature A11). Owner: S22.
#
#   docker compose -f deploy/docker-compose.yml up -d                      # Gateway only
#   docker compose -f deploy/docker-compose.yml --profile tailscale up -d  # + Tailscale Serve
#   docker compose -f deploy/docker-compose.yml --profile cloudflare up -d # + Cloudflare Tunnel
#   docker compose -f deploy/docker-compose.yml --profile browser up -d    # + Playwright sidecar
#
# Network model. The Gateway refuses any bind but loopback (security §10), so it runs with host
# networking and listens on the HOST's 127.0.0.1:7979. Nothing is published. Remote access goes
# through a proxy that also runs on the host network and forwards to 127.0.0.1:7979 (Tailscale
# Serve, cloudflared), or an SSH tunnel: ssh -L 7979:127.0.0.1:7979 server.
# Host networking needs Linux (or Docker Desktop with host networking turned on).
#
# Pairing the first admin device: docker compose exec gateway psyched devices approve <CODE>

name: psyche

x-hardening: &hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  gateway:
    <<: *hardening
    image: ${PSYCHE_IMAGE:-ghcr.io/devmello/psyche-gateway:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    restart: unless-stopped
    # Gateway settings (port, publicOrigin, allowedOrigins, trustedProxy) live in config.json on
    # the volume: `docker compose exec gateway psyche config set gateway.publicOrigin https://…`,
    # then `docker compose restart gateway`. No PSYCHE_HOST/PORT/ALLOWED_ORIGINS here: environment
    # variables would silently win over config.json. The bind is loopback either way.
    environment:
      PSYCHE_LOG_LEVEL: ${PSYCHE_LOG_LEVEL:-info}
    volumes:
      - psyche-home:/data
      # Optional: run sandboxes as sibling containers on the host's Docker.
      # RISK: the Docker socket is root on this host. Anything that controls the Gateway process
      # can then start privileged containers. Prefer a rootless Podman socket, or run the sandbox
      # on a separate machine. Never enable this on a shared host.
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PSYCHE_PORT||7979)+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Tailscale Serve: tailnet-only HTTPS in front of the loopback Gateway (deploy/tailscale/).
  tailscale:
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    profiles: [tailscale]
    network_mode: host
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-psyche}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-} # deploy/.env: a one-off, tagged auth key
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  # Cloudflare Tunnel: outbound-only connector; protect the hostname with Cloudflare Access
  # (deploy/cloudflare/).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    profiles: [cloudflare]
    network_mode: host
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-} # deploy/.env
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Headless browser for topology D (no Mac): Playwright run-server on the host's 127.0.0.1:3000.
  # RISK: run-server has no authentication; any local process can drive it. Keep the host
  # single-tenant. `npx` fetches the pinned playwright package on each start (the image ships the
  # browsers, not the package); bake your own image if the server must start offline. The Gateway's browser driver applies the origin policy (security §6), not this
  # container.
  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    profiles: [browser]
    network_mode: host
    restart: unless-stopped
    user: pwuser
    init: true
    ipc: private
    shm_size: 1gb
    command: ["npx", "-y", "playwright@1.64.1", "run-server", "--host", "127.0.0.1", "--port", "3000"]
    security_opt:
      - no-new-privileges:true

volumes:
  psyche-home:
  tailscale-state:
