packages:
  - "apps/*"
  - "packages/*"
  - "tests/integration"
  - "tests/acceptance"

# pnpm 11+ runs dependency lifecycle scripts only for packages approved here
# (`pnpm approve-builds <pkg>` edits this map). Keep it short and reviewed.
allowBuilds:
  better-sqlite3: true
  # Prebuilt binaries ship in the tarball; the only "script" is pnpm's implicit
  # `node-gyp rebuild` for binding.gyp, which is a no-op here (S06).
  better-sqlite3-multiple-ciphers: false
  electron: true
  esbuild: true
  node-pty: true
  # Pulled in by @univerjs/protocol -> @grpc/grpc-js; its postinstall only prints a notice (S13).
  protobufjs: false
# Dependency audit (reports/m3-dependency-audit.md):
# - pptxgenjs 4.0.1 declares image-size ^1.2.1 (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr) but never
#   loads it; 2.0.4 is patched.
# - sandpack-client's Node client pulls @codesandbox/nodebox (Sustainable Use License, not open
#   source). Psyche imports only `clients/runtime`, so the dependency is removed (ADR-013).
# - sprintf-js 1.0.3 (GHSA-hp3w-g68c-fv3c, moderate) has no patched release; it is reachable only
#   from mammoth's CLI through argparse, which Psyche never runs. Accepted risk (issue #299, DEP-10).
auditConfig:
  ignoreGhsas:
    - GHSA-hp3w-g68c-fv3c
overrides:
  "pptxgenjs>image-size": "2.0.4"
  "@codesandbox/sandpack-client>@codesandbox/nodebox": "-"
engineStrict: true
autoInstallPeers: true

# Electron Forge refuses to run under pnpm unless node-linker=hoisted or an explicit hoist
# pattern is configured. Keep the isolated layout and publicly hoist only Electron itself
# (the desktop bundles everything else with Vite).
publicHoistPattern:
  - electron
