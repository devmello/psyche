packages:
  - "apps/*"
  - "packages/*"
  - "tests/integration"
  - "tests/acceptance"

# pnpm 11+ runs dependency lifecycle scripts only for packages approved here
# (`pnpm approve-builds <pkg>` edits this map). Keep it short and reviewed.
allowBuilds:
  better-sqlite3: true
  # Prebuilt binaries ship in the tarball; the only "script" is pnpm's implicit
  # `node-gyp rebuild` for binding.gyp, which is a no-op here (S06).
  better-sqlite3-multiple-ciphers: false
  electron: true
  esbuild: true
  node-pty: true
  # Pulled in by @univerjs/protocol -> @grpc/grpc-js; its postinstall only prints a notice (S13).
  protobufjs: false
  # On-device embeddings (docs/design/search-2026.md §3): the prebuilt CPU binaries for macOS and
  # Windows ship in the tarball; the postinstall only downloads optional CUDA/TensorRT libraries.
  onnxruntime-node: false
# Dependency audit (docs/archive/reports/m3-dependency-audit.md):
# - pptxgenjs 4.0.1 declares image-size ^1.2.1 (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr) but never
#   loads it; 2.0.4 is patched.
# - sandpack-client's Node client pulls @codesandbox/nodebox (Sustainable Use License, not open
#   source). Psyche imports only `clients/runtime`, so the dependency is removed (ADR-013).
# - sprintf-js 1.0.3 (GHSA-hp3w-g68c-fv3c, moderate) has no patched release; it is reachable only
#   from mammoth's CLI through argparse, which Psyche never runs. Accepted risk (issue #299, DEP-10).
auditConfig:
  ignoreGhsas:
    - GHSA-hp3w-g68c-fv3c
overrides:
  "pptxgenjs>image-size": "2.0.4"
  "@codesandbox/sandpack-client>@codesandbox/nodebox": "-"
# Owner decision 2026-10-20 (issue #299, DEP-11): a new dependency version must be at least 24 h
# old before pnpm will pick it, which blunts compromised-publish attacks. Fresh pins made by a
# session arrive a day late; the Dependabot PRs are unaffected by then.
minimumReleaseAge: 1440
engineStrict: true
autoInstallPeers: true

# Disk (docs/guides/monorepo-layout.md, CONTRIBUTING.md "Disk & worktrees"). pnpm 12 reads its settings
# from this file only: the same keys in a root .npmrc have no effect (checked with `pnpm config list`).
# The store stays global (default: ~/Library/pnpm/store/v11), so every worktree shares one copy.
# `clone-or-copy` imports with APFS clones (copy-on-write: a worktree's node_modules costs almost no
# disk) and falls back to a plain copy; it never hardlinks, so editing a file in one worktree cannot
# change another's or the store's.
packageImportMethod: clone-or-copy
# Build results of allowBuilds packages (node-pty's native build) are stored once in the store and
# restored into each worktree instead of being rebuilt. Electron 44 has no install script (its dist is
# extracted on first launch), so scripts/dev/electron-dist.sh shares that one instead.
sideEffectsCache: true

# Electron Forge refuses to run under pnpm unless node-linker=hoisted or an explicit hoist
# pattern is configured. Keep the isolated layout and publicly hoist only Electron itself
# (the desktop bundles everything else with Vite).
publicHoistPattern:
  - electron
