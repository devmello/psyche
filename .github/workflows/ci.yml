# CI for the Psyche monorepo (S00 owns this file).
# main has no branch protection; merges are gated on local per-change tests (docs/09-execution-plan.md).
name: ci

# CI diet (2026-10-19, owner decision): local per-change tests are the merge gate. Pull requests get a fast
# Linux lint + typecheck; the full suite runs on pushes to main (Linux only); macOS runs on demand or on tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests never launch Electron, so skip the ~100 MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # No telemetry, including from our tools (docs/05-security-and-permissions.md).
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # Live tests (real network, real providers) stay off in CI.
  PSYCHE_LIVE_TESTS: "0"

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is the newest GA Apple-silicon image (actions/runner-images, 2026-10).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","macos-26"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret grep gate
        # Cheap pattern check for obvious tokens and credentials in URLs.
        # TODO(S18): replace or extend with the real secret-leak checker from packages/testing.
        run: scripts/ci/secret-grep.sh

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint

      - name: Strings come from the message catalogue (A12)
        run: pnpm i18n:check

      - name: Test
        if: github.event_name != 'pull_request'
        run: pnpm -r test

      - name: Protocol codegen is fresh
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.title, 'protocol')
        run: |
          pnpm protocol:check
          git diff --exit-code -- packages/protocol/generated apps/mac-helper/Sources/PsycheProtocol
          untracked="$(git status --porcelain --untracked-files=all -- packages/protocol/generated apps/mac-helper/Sources/PsycheProtocol)"
          if [ -n "$untracked" ]; then
            echo "::error::Generated protocol files are stale or uncommitted. Run 'pnpm protocol:gen' and commit the result."
            echo "$untracked"
            exit 1
          fi

      - name: Swift build (mac-helper)
        if: runner.os == 'macOS'
        run: |
          swift --version
          swift build --package-path apps/mac-helper

      - name: Swift test (mac-helper)
        if: runner.os == 'macOS'
        run: |
          if [ -d apps/mac-helper/Tests ]; then
            swift test --package-path apps/mac-helper
          else
            echo "apps/mac-helper/Tests does not exist yet; skipping swift test."
          fi

  # Did this push or PR touch the protocol or the Swift helper? (#731: a protocol enum addition,
  # #714, broke the helper's exhaustive switches, and nothing built Swift until #730.)
  changes:
    name: helper changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      helper: ${{ steps.diff.outputs.helper }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Paths changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$(git merge-base "$PR_BASE" HEAD)" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          # A manual run, a tag, a new branch or an unknown base: build the helper.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "helper=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(packages/protocol/|apps/mac-helper/)'; then
            echo "helper=true" >> "$GITHUB_OUTPUT"
          else
            echo "helper=false" >> "$GITHUB_OUTPUT"
          fi

  # The Swift helper builds and its suites pass whenever the protocol or the helper changes, on
  # pull requests and on pushes to main, so a protocol change that breaks it is red before merge.
  # The ubuntu job above stays the fast check.
  helper:
    name: mac helper (swift build + test)
    needs: changes
    if: needs.changes.outputs.helper == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "id=$(swift --version 2>&1 | head -n1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Swift build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mac-helper/.build
          # Exact hit for unchanged sources; otherwise the newest build for this toolchain and
          # manifest, so the build is incremental.
          key: helper-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('apps/mac-helper/Package.swift', 'apps/mac-helper/Package.resolved') }}-${{ hashFiles('apps/mac-helper/Sources/**', 'apps/mac-helper/Tests/**') }}
          restore-keys: |
            helper-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('apps/mac-helper/Package.swift', 'apps/mac-helper/Package.resolved') }}-
      - name: Swift build (with tests)
        run: swift build --package-path apps/mac-helper --build-tests
      - name: Swift test
        run: swift test --package-path apps/mac-helper --skip-build

