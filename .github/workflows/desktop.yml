# Desktop shell build and smoke tests on macOS (S11; S00 owns .github/ and may fold this into ci.yml).
# Builds the app unsigned (no signing secrets exist in CI) and runs the Playwright-for-Electron
# smoke tests against the mock Gateway. Network stays on 127.0.0.1.
name: desktop

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "tests/integration/**", "pnpm-lock.yaml"]
  pull_request:
    paths: ["apps/**", "packages/**", "tests/integration/**", "pnpm-lock.yaml"]

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  PSYCHE_LIVE_TESTS: "0"

jobs:
  desktop:
    name: desktop (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (with the Electron binary)
        run: pnpm install --frozen-lockfile

      - name: Unsigned package
        run: pnpm --filter @psyche/desktop package

      - name: Electron smoke tests
        env:
          CI: "1"
        run: pnpm --filter @psyche/desktop e2e

      - name: Walking skeleton in Electron (INT-1, scripted model)
        env:
          CI: "1"
        run: pnpm --filter @psyche/integration-tests e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-playwright-report
          path: |
            apps/desktop/playwright-report
            tests/integration/playwright-report
          retention-days: 7
