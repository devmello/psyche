# Desktop shell build and smoke tests on macOS (S11; S00 owns .github/ and may fold this into ci.yml).
# Builds the app unsigned (no signing secrets exist in CI) and runs the Playwright-for-Electron
# smoke tests against the mock Gateway. Network stays on 127.0.0.1.
# The windows job builds the Windows installer the way `pnpm app:build` does on a PC
# (deploy/windows/build-local.ps1) and uploads Psyche-<version>-Setup.exe, the zip and the Squirrel
# feed files. Authenticode signing switches on only when its secrets exist.
name: desktop

on:
  # CI diet (2026-10-19): expensive suites run on demand, nightly and on release tags, not per PR.
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    tags: ["v*"]

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  PSYCHE_LIVE_TESTS: "0"

jobs:
  desktop:
    name: desktop (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (with the Electron binary)
        run: pnpm install --frozen-lockfile

      - name: Ad-hoc package (without psyched and the helper; the smoke tests use the mock Gateway)
        env:
          PSYCHE_PACKAGE_ALLOW_PARTIAL: "1"
        run: pnpm --filter @psyche/desktop package

      - name: Electron smoke tests
        env:
          CI: "1"
        run: pnpm --filter @psyche/desktop e2e

      - name: Walking skeleton in Electron (INT-1, scripted model)
        env:
          CI: "1"
        run: pnpm --filter @psyche/integration-tests e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-playwright-report
          path: |
            apps/desktop/playwright-report
            tests/integration/playwright-report
          retention-days: 7

  windows:
    name: desktop (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (with the Electron binary)
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain (for apps/win-helper)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Signing certificate (only when the secret exists)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "psyche-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            "WINDOWS_CERTIFICATE_FILE=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host "No WINDOWS_CERTIFICATE_BASE64 secret: building unsigned"
          }

      - name: Build the installer (deploy/windows/build-local.ps1)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # Without the helper crate on the branch the package is built without it (dev only).
          $skip = if (Test-Path apps/win-helper/Cargo.toml) { @() } else { @("-SkipHelper") }
          ./deploy/windows/build-local.ps1 @skip

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-windows-x64
          path: |
            dist/Psyche-*-Setup.exe
            dist/Psyche-*-win32-x64.zip
            dist/squirrel-win32-x64/
          retention-days: 14
