# Release pipeline (roadmap v1.0; docs/guides/install.md). Owner: S22.
# Runs ONLY on version tags (v*) and by hand; never on pull requests or main pushes (CI diet,
# PR #165). A manual run is a dry run unless dry_run is unticked.
#
#   Deploy smoke   image build, `docker compose up --wait`, `psyche status` in and outside the
#                  container, backup scripts round trip; gates the image push
#   Docker image   ghcr.io/<owner>/psyche-gateway:<version>, linux/amd64 + linux/arm64, SBOM and
#                  provenance, signed keyless with cosign (GitHub OIDC; signer identity
#                  .github/workflows/release.yml@refs/tags/v*)
#   Sandbox image  ghcr.io/devmello/psyche-sandbox core/base/full (deploy/sandbox-image/publish.sh),
#                  same platforms, SBOM and provenance, signed keyless and verified against
#                  versions.json .signing; the updated versions.json is a release asset
#                  (sandbox-image-versions.json) and comes back to main as a PR
#   CLI            psyche-{darwin,linux}-{arm64,x64} single binaries (bun --compile) with the
#                  version and the database migrations baked in (`psyche migrate --check`)
#   Desktop        the dmg and cli jobs BUILD, unsigned (ad-hoc), with no environment and no signing
#                  secrets. One `sign` job (environment release) downloads them,
#                  signs the apps inside out (deploy/macos/sign-bundle.sh, the same script
#                  build-local.sh uses) with Psyche's own self-signed certificate
#                  (deploy/macos/make-signing-cert.sh), checks them (codesign --verify --deep --strict,
#                  the designated requirement, the hardened runtime and entitlements, the Electron
#                  fuses, the size budgets), makes Psyche-<version>-{arm64,x64}.dmg + .sha256 and
#                  the update zip, and signs the macOS CLI binaries. While its keychain is unlocked
#                  it runs only codesign, ditto, hdiutil and our own scripts. Not notarized: a paid
#                  Developer ID would add a notarize step to that job (design doc, Appendix A)
#   Windows        Psyche-<version>-Setup.exe, Psyche-<version>-win32-x64.zip and the Squirrel feed
#                  (RELEASES, Psyche-<nuget-version>-full.nupkg, and a -delta.nupkg against the
#                  previous Windows release when there is one) from deploy/windows/build-local.ps1.
#                  The one exception to "builds are unsigned": Squirrel.Windows signs inside
#                  `electron-forge make` (the nupkg holds the signed Psyche.exe and Setup.exe embeds
#                  the nupkg), so signing cannot move to a later job. It is its own `windows` job,
#                  in the `release` environment like `sign`, and the only job with the Authenticode
#                  secrets; unsigned when they are absent
#   Release        GitHub release with SHA256SUMS and notes from the changesets CHANGELOGs
#   Homebrew       Casks/psyche.rb and Formula/psyche-cli.rb pushed to <owner>/homebrew-psyche
#   Version PR     manual run with version_pr: changesets opens the "Version Packages" PR
#
# The macOS secrets below live in the `release` ENVIRONMENT (tags only, required reviewers), not in
# repository secrets, used by the sign job alone. A publishing run FAILS that job without them (it never ships an
# ad-hoc build); a manual dry run uses `release-dry-run`, has none, and builds ad-hoc without
# publishing. Without RELEASE_SIGNING_KEY there is no update manifest and without the tap token the
# tap is not updated; those steps skip cleanly (never echo any of them):
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY
#       Psyche's self-signed release certificate (the psyche-release.p12 that
#       deploy/macos/make-signing-cert.sh writes; MACOS_SIGNING_IDENTITY = its SHA-1 hash). Signs
#       the app, the DMG and the macOS CLI binaries. A paid Developer ID certificate works in the
#       same three secrets, as an optional later path.
#   (No Apple API key is used: the release is not notarized, and the notes carry the "Open Anyway"
#   section, deploy/macos/open-anyway.md.)
#   WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD
#       Authenticode code-signing certificate (.pfx); or, without it, Azure Trusted Signing:
#   AZURE_TRUSTED_SIGNING_ENDPOINT, _ACCOUNT, _PROFILE, _DLIB, AZURE_TENANT_ID, _CLIENT_ID, _CLIENT_SECRET
#       (apps/desktop/docs/signing.md "Windows: Authenticode"). Also secrets of the `release`
#       environment, used by the windows job alone. An unsigned Windows build installs but never
#       updates itself (the updater requires a valid signature)
#   HOMEBREW_TAP_TOKEN
#       fine-grained token with contents:write on <owner>/homebrew-psyche only
#   RELEASE_SIGNING_KEY  (environment "release", with required reviewers)
#       Ed25519 PKCS#8 PEM that signs update-manifest.json; the desktop embeds the public half
#       (apps/desktop/src/main/release-keys.ts). Without it no manifest is published and installed
#       apps do not auto-update (they never apply an unsigned update).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but publish nothing (no push, no release, no tap update)"
        type: boolean
        default: true
      version_pr:
        description: "Only open or update the changesets Version Packages PR"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/psyche-gateway
  BUN_VERSION: "1.4.3"
  # Publish only for a real tag push; a manual run is a dry run unless dry_run is unticked.
  PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) version="${REF#v}" ;;
            *) version="0.0.0-dev.${GITHUB_RUN_NUMBER}" ;;
          esac
          case "$version" in *[!0-9A-Za-z.-]*) echo "::error::bad version $version"; exit 1 ;; esac
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  deploy-smoke:
    name: deploy smoke (compose)
    needs: version
    if: inputs.version_pr != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Release preflight (24 h dependency cool-down, pins, Compose, update policy, signer)
        run: node deploy/scripts/release-preflight.mjs

      - name: Node base images are pinned, agree, and are the newest release (#295)
        run: node deploy/scripts/node-pins.mjs check --latest

      - name: Build the Gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: psyche-gateway:smoke
          build-args: PSYCHE_VERSION=0.0.0-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose up and wait for /healthz
        env:
          PSYCHE_IMAGE: psyche-gateway:smoke
        run: docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 120

      - name: psyche status inside the container
        run: docker compose -f deploy/docker-compose.yml exec -T gateway psyche status --json

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: psyche status from the host (loopback, host networking)
        run: |
          pnpm install --frozen-lockfile --filter "@psyche/cli..."
          curl -fsS http://127.0.0.1:7979/healthz
          node apps/cli/src/main.ts status --json
          node apps/cli/src/main.ts doctor --offline --json || true

      - name: Image runs as non-root, read-only, no published ports
        run: |
          id=$(docker compose -f deploy/docker-compose.yml ps -q gateway)
          test "$(docker inspect -f '{{.Config.User}}' "$id")" = "10001:10001"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = "true"
          test "$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$id")" = "{}"

      - name: Backup scripts round trip
        env:
          PSYCHE_IMAGE: psyche-gateway:smoke
          PSYCHE_BACKUP_PASSPHRASE: smoke-test-passphrase-only
        run: |
          dir="$(mktemp -d)"
          sudo chown 10001:10001 "$dir" && sudo chmod 700 "$dir"
          deploy/backup/backup.sh "$dir"
          file="$(sudo ls "$dir" | grep '\.tar\.gz\.age$' | head -n1)"
          deploy/backup/verify.sh "$dir/$file"
          deploy/backup/restore.sh "$dir/$file"
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 120

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color gateway

      - name: Compose down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  changesets:
    name: version packages PR
    if: github.event_name == 'workflow_dispatch' && inputs.version_pr == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Open or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The gateway image builds natively per architecture (amd64 on ubuntu-latest, arm64 on
  # ubuntu-24.04-arm) and pushes each by digest; image-manifest joins them into one tagged,
  # signed manifest list. A single QEMU build of both ran past the timeout (release attempt 4).
  # The gha cache is per architecture (scope gateway-<arch>).
  image:
    name: gateway image ${{ matrix.arch }}
    needs: [version, deploy-smoke]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - name: Build (and push by digest on a tag) linux/${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PSYCHE_VERSION=${{ needs.version.outputs.version }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=gateway-${{ matrix.arch }}
          cache-to: type=gha,scope=gateway-${{ matrix.arch }},mode=max
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: gateway image (multi-arch, signed)
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download the per-arch digests
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gateway-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Set up Buildx
        if: env.PUBLISH == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - name: Tagged manifest list from the per-arch digests
        id: manifest
        if: env.PUBLISH == 'true'
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::want 2 per-arch digests, got: $(ls)"; exit 1; }
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no manifest list digest"; exit 1; }
          docker buildx imagetools inspect "${IMAGE}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest (keyless, GitHub OIDC)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # K8: the sandbox image (owner S21). Each architecture builds natively (no QEMU) on its own
  # runner, core -> base -> full in order so each target reuses the previous one's layers, and
  # pushes them by digest (publish.sh --platform). sandbox-image-manifest then tags, signs and
  # records all three in versions.json (publish.sh --merge). It only publishes on a v* tag (a
  # manual run on a tag with dry_run unticked counts); otherwise publish.sh --dry-run.
  sandbox-image:
    name: sandbox image ${{ matrix.arch }}
    needs: version
    if: inputs.version_pr != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish or dry run
        id: mode
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$IS_TAG" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sandbox image: dry run (publishes only on a v* tag)."
          fi
      - name: Check the repository and the signer identity before building
        if: steps.mode.outputs.publish == 'true'
        working-directory: deploy/sandbox-image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="$(jq -er .repository versions.json)"
          case "$repo" in
            "ghcr.io/${OWNER,,}/"*) ;;
            *) echo "::error::versions.json repository $repo is not under ghcr.io/${OWNER,,}"; exit 1 ;;
          esac
          identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          echo "This run signs as: $identity"
          jq -e --arg id "$identity" '.signing.certificateIdentityRegexp as $re | $id | test($re)' \
            versions.json > /dev/null \
            || { echo "::error::versions.json .signing.certificateIdentityRegexp does not match $identity"; exit 1; }
      - name: Free disk space (full is about 2.3 GB per platform)
        if: steps.mode.outputs.publish == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Set up Buildx
        if: steps.mode.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push core, base, full for linux/${{ matrix.arch }} by digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_SANDBOX: ${{ steps.mode.outputs.publish }}
          ARCH: ${{ matrix.arch }}
        run: |
          flags=()
          if [ "$PUBLISH_SANDBOX" != "true" ]; then flags+=(--dry-run); fi
          deploy/sandbox-image/publish.sh "${flags[@]}" --version "$VERSION" \
            --platform "linux/$ARCH" --digests-dir "$RUNNER_TEMP/sandbox-digests" core base full
      - name: Upload the digests
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandbox-digests/
          if-no-files-found: error
          retention-days: 1

  sandbox-image-manifest:
    name: sandbox image (multi-arch, signed)
    needs: [version, sandbox-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      published: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish or dry run
        id: mode
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$IS_TAG" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sandbox image: dry run (publishes only on a v* tag)."
          fi
      - name: Download the per-arch digests
        if: steps.mode.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sandbox-digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/sandbox-digests
      - name: Set up Buildx
        if: steps.mode.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        if: steps.mode.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Tag, sign and record core, base, full (manifest lists)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_SANDBOX: ${{ steps.mode.outputs.publish }}
        run: |
          flags=()
          if [ "$PUBLISH_SANDBOX" != "true" ]; then flags+=(--dry-run); fi
          deploy/sandbox-image/publish.sh "${flags[@]}" --version "$VERSION" \
            --merge "$RUNNER_TEMP/sandbox-digests" core base full
      - name: Verify the signatures against versions.json
        if: steps.mode.outputs.publish == 'true'
        working-directory: deploy/sandbox-image
        run: |
          repo="$(jq -er .repository versions.json)"
          re="$(jq -er .signing.certificateIdentityRegexp versions.json)"
          issuer="$(jq -er .signing.certificateOidcIssuer versions.json)"
          for v in core base full; do
            digest="$(jq -er --arg v "$v" '.variants[$v].digest' versions.json)"
            cosign verify "${repo}@${digest}" \
              --certificate-identity-regexp "$re" --certificate-oidc-issuer "$issuer" > /dev/null
            echo "verified $v ${repo}@${digest}"
          done
          jq . versions.json
      - name: Keep versions.json for the release and the pin PR
        if: steps.mode.outputs.publish == 'true'
        run: |
          mkdir -p sandbox-out
          cp deploy/sandbox-image/versions.json sandbox-out/sandbox-image-versions.json
      - name: Upload versions.json
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-image-versions
          path: sandbox-out/sandbox-image-versions.json
          if-no-files-found: error

  # A tag build cannot push to main, so the new digests come back as a PR against the default
  # branch. Only `version` and `variants` are copied over, so a newer main keeps its own base
  # images and signing block. Needs "Allow GitHub Actions to create and approve pull requests";
  # a PR opened with GITHUB_TOKEN does not trigger CI, so close and reopen it (or push) to run it.
  sandbox-image-pr:
    name: sandbox image digests PR
    needs: [version, sandbox-image-manifest]
    if: needs.sandbox-image-manifest.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download versions.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandbox-image-versions
          path: ${{ runner.temp }}/sandbox
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
          PUBLISHED: ${{ runner.temp }}/sandbox/sandbox-image-versions.json
        run: |
          file=deploy/sandbox-image/versions.json
          jq --slurpfile pub "$PUBLISHED" '.version = $pub[0].version | .variants = $pub[0].variants' \
            "$file" > "$RUNNER_TEMP/versions.json"
          mv "$RUNNER_TEMP/versions.json" "$file"
          # Same formatting as `pnpm -w lint` (biome), at the repo's pinned version.
          biome="$(node -p 'require("./package.json").devDependencies["@biomejs/biome"]')"
          npx --yes "@biomejs/biome@${biome}" format --write "$file"
          note=""
          if ! jq -e --slurpfile pub "$PUBLISHED" '.baseImages == $pub[0].baseImages' "$file" > /dev/null; then
            note="**Note:** ${BASE} has different \`baseImages\` than ${TAG} was built with; these digests are from ${TAG}'s base images."
          fi
          if git diff --quiet -- "$file"; then
            echo "::notice::${BASE} already pins these digests."
            exit 0
          fi
          branch="sandbox-image/v${VERSION}"
          git config user.name "psyche-release"
          git config user.email "psyche-release@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$file"
          git commit -m "chore(sandbox): pin sandbox image ${VERSION} digests"
          # Token through gh's credential helper, never in a URL or the remote config.
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/${branch}"
          {
            echo "Release ${TAG} published and signed the sandbox image (K8). This pins the digests in \`${file}\`."
            echo
            echo '```json'
            jq '{version, variants}' "$file"
            echo '```'
            echo
            echo "Verify any variant: \`cosign verify $(jq -r .repository "$file")@<digest> --certificate-identity-regexp \"\$(jq -r .signing.certificateIdentityRegexp ${file})\" --certificate-oidc-issuer \"\$(jq -r .signing.certificateOidcIssuer ${file})\"\`"
            echo
            echo "$note"
            echo
            echo "Opened by the release workflow with GITHUB_TOKEN, so CI did not run: close and reopen this PR to run it."
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE" --head "$branch" \
              --title "[S21 sandbox] chore(sandbox): pin sandbox image ${VERSION} digests" --body-file "$RUNNER_TEMP/body.md"
          fi

  cli:
    name: psyche ${{ matrix.target }}
    needs: version
    if: inputs.version_pr != true
    # No environment and no signing secrets here: this job compiles third-party code. The `sign` job signs.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-26 }
          - { target: darwin-x64, os: macos-26 }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Bun (single-binary bundler)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the CLI's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@psyche/cli..."
      - name: Compile (version and database migrations baked in)
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          migrations="$(node deploy/scripts/migrations-manifest.mjs)"
          bun build apps/cli/src/main.ts --compile --minify \
            --target="bun-${TARGET}" \
            --define "__PSYCHE_VERSION__=\"${VERSION}\"" \
            --define "__PSYCHE_MIGRATIONS__=${migrations}" \
            --outfile "dist/psyche-${TARGET}"
      - name: Smoke test (native targets)
        if: matrix.target == 'darwin-arm64' || matrix.target == 'linux-x64'
        env:
          BIN: dist/psyche-${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          "$BIN" version --json | grep -F "\"$VERSION\""
          "$BIN" completion bash > /dev/null
          home="$(mktemp -d)"
          PSYCHE_HOME="$home" PSYCHE_PORT=1 "$BIN" migrate --check --json
      - name: Ad-hoc signature (macOS; arm64 runs no unsigned code; the sign job re-signs it)
        if: startsWith(matrix.target, 'darwin')
        env:
          BIN: dist/psyche-${{ matrix.target }}
        run: |
          codesign --force --sign - "$BIN"
          codesign --verify --strict "$BIN"
      - name: Upload (macOS binaries are named unsigned-*; the sign job signs them and uploads the release copy)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ startsWith(matrix.target, 'darwin') && 'unsigned-' || '' }}psyche-${{ matrix.target }}
          path: dist/psyche-${{ matrix.target }}
          if-no-files-found: error

  dmg:
    name: Psyche ${{ matrix.arch }} app (unsigned build)
    needs: version
    if: inputs.version_pr != true
    # Builds an UNSIGNED (ad-hoc) app with no environment and no signing secrets: this job runs the whole
    # dependency tree's build code. The `sign` job signs it, and makes the DMG and the update zip.
    # psyched bundles native addons and a Node runtime for the host's arch, so each arch builds on
    # a runner of that arch (deploy/scripts/build-psyched.mjs refuses a mismatch).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The Intel DMG cannot block a pre-release: its older toolchain (macos-15-intel) keeps finding
    # new Swift 6 errors in the helper. The release then ships Apple silicon only and says so; a
    # stable release still needs both.
    continue-on-error: ${{ matrix.arch == 'x64' && needs.version.outputs.prerelease == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (with the Electron binary)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
        run: pnpm install --frozen-lockfile
      - name: Stamp the release version (the updater compares against it)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node -e 'const f="apps/desktop/package.json",fs=require("fs"),p=JSON.parse(fs.readFileSync(f));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
      - name: Build the bundled Gateway (psyched)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # apps/gateway/dist-bin/darwin-<arch>/psyched, started once against /healthz (--smoke).
          node deploy/scripts/build-psyched.mjs --arch "$ARCH" --smoke
      - name: Build Psyche Helper (ad-hoc) for Contents/Resources
        env:
          ARCH: ${{ matrix.arch }}
          PSYCHE_VERSION: ${{ needs.version.outputs.version }}
          # Leaves out the development-only Secure Enclave file-key fallback (security §10).
          PSYCHE_PUBLIC_RELEASE: "1"
        run: |
          deploy/macos/build-helper.sh --arch "$ARCH"
          # forge.config.ts copies both into the app (apps/desktop/src/packaging/bundle-resources.ts);
          # dist/PsycheHelper.app is the agreed helper path, passed explicitly.
          echo "PSYCHE_HELPER_APP=$PWD/apps/mac-helper/dist/PsycheHelper.app" >> "$GITHUB_ENV"
      - name: Package Psyche.app (ad-hoc; no signing identity exists in this job)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # One retry: electron-packager downloads Electron and occasionally gets "fetch failed".
          pnpm --filter @psyche/desktop run package --arch="$ARCH" || {
            echo "::warning::package failed; retrying once in 20 s"
            sleep 20
            pnpm --filter @psyche/desktop run package --arch="$ARCH"
          }
      - name: Archive the unsigned app (ditto keeps symlinks and attributes)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app="$(find apps/desktop/out -maxdepth 2 -name Psyche.app -path "*darwin-${ARCH}*" | head -n1)"
          test -n "$app" || { echo "::error::no Psyche.app for $ARCH"; exit 1; }
          mkdir -p unsigned
          ditto -c -k --sequesterRsrc --keepParent "$app" "unsigned/unsigned-Psyche-${ARCH}.app.zip"
      - name: Upload the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-psyche-app-${{ matrix.arch }}
          path: unsigned/unsigned-Psyche-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  sign:
    name: Sign
    needs: [version, cli, dmg]
    # Same rule as the release job: the DMG matrix may lose its Intel leg in a pre-release.
    if: >-
      ${{ !cancelled() && inputs.version_pr != true
      && needs.version.result == 'success' && needs.cli.result == 'success'
      && (needs.dmg.result == 'success' || needs.version.outputs.prerelease == 'true') }}
    # THE only job that sees the signing certificate. Secrets are secrets of the `release` environment
    # (tags only, required reviewers), so a tag needs TWO approvals: this job and the `release` job (manifest signing, GitHub Release) both use the
    # `release` environment; a manual dry run uses
    # `release-dry-run`, which has none, and checks the unsigned build without publishing.
    # While the keychain is unlocked this job runs only our own scripts and Apple's tools: codesign,
    # ditto, hdiutil, security, find, file and shell. No package manager, no build tool, no
    # dependency code. (Node runs deploy/scripts/size-budget.mjs and read-fuses.mjs: our files, with
    # no imports beyond node:*.)
    environment: ${{ (github.event_name == 'push' || inputs.dry_run == false) && 'release' || 'release-dry-run' }}
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.keychain.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node (our own scripts only; no install)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download the unsigned builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          path: unsigned
          merge-multiple: true
      - name: Unpack the apps
        run: |
          mkdir -p work
          found=0
          for z in unsigned/unsigned-Psyche-*.app.zip; do
            [ -e "$z" ] || continue
            arch="$(basename "$z" .app.zip)"; arch="${arch#unsigned-Psyche-}"
            mkdir -p "work/$arch"
            ditto -x -k "$z" "work/$arch"
            test -d "work/$arch/Psyche.app" || { echo "::error::$z has no Psyche.app"; exit 1; }
            found=$((found + 1))
          done
          test -d work/arm64/Psyche.app || { echo "::error::no Apple silicon app to sign"; exit 1; }
          echo "unpacked $found app(s)"
      - name: Signing keychain (self-signed release certificate)
        id: keychain
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Publishing without the signing secrets (MACOS_CERTIFICATE_P12_BASE64, MACOS_SIGNING_IDENTITY): refusing to ship an ad-hoc build. Put them in the release environment."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets (dry run): the builds stay ad-hoc. Nothing here is published."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(openssl rand -hex 16)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          # A self-signed certificate is never "valid" to find-identity (nothing trusts it), so list
          # without -v. The identity must be the certificate's SHA-1 (40 hex digits).
          if ! security find-identity -p codesigning "$kc" | grep -qiF "$IDENTITY"; then
            echo "::error::MACOS_SIGNING_IDENTITY is not in the imported certificate (use the SHA-1 that make-signing-cert.sh printed)."
            exit 1
          fi
          {
            echo "PSYCHE_SIGN_IDENTITY=$IDENTITY"
            echo "PSYCHE_SIGN_KEYCHAIN=$kc"
            echo "PSYCHE_SIGN_TIMESTAMP=1"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Sign the apps (deploy/macos/sign-bundle.sh, the script build-local.sh uses too)
        if: steps.keychain.outputs.signed == 'true'
        run: |
          for app in work/*/Psyche.app; do
            deploy/macos/sign-bundle.sh --app "$app" --identity "$PSYCHE_SIGN_IDENTITY" \
              --keychain "$PSYCHE_SIGN_KEYCHAIN" --timestamp
          done
      - name: Sign the macOS CLI binaries
        if: steps.keychain.outputs.signed == 'true'
        run: |
          # Bun's JIT needs these under the hardened runtime. These are the CLI's own entitlements,
          # not the app's: the app-only checks below do not apply to the CLI binary.
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-executable-page-protection</key><true/>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          PLIST
          mkdir -p signed-cli
          for f in unsigned/unsigned-psyche-darwin-*; do
            [ -e "$f" ] || continue
            out="signed-cli/${f#unsigned/unsigned-}"
            cp "$f" "$out"
            codesign --force --options runtime --timestamp --keychain "$PSYCHE_SIGN_KEYCHAIN" \
              --entitlements "$RUNNER_TEMP/entitlements.plist" --sign "$PSYCHE_SIGN_IDENTITY" "$out"
            codesign --verify --strict --verbose=2 "$out"
          done
      - name: Check the signed apps (signature, designated requirement, hardened runtime, entitlements, fuses, size)
        run: |
          for app in work/*/Psyche.app; do
            echo "== $app"
            # The seal is intact and every nested binary is signed (an ad-hoc dry run passes too).
            codesign --verify --deep --strict --verbose=2 "$app"
            # Designated requirement of the app and the helper, the same certificate on every Gateway
            # binary, no LSFileQuarantineEnabled, the hardened runtime on everywhere, no
            # allow-dyld-environment-variables or get-task-allow, and library validation kept on the
            # helper. A publishing run is always checked; it cannot be ad-hoc (the keychain step refuses).
            if [ -n "${PSYCHE_SIGN_IDENTITY:-}" ] || [ "$PUBLISH" = "true" ]; then
              deploy/macos/check-designated-requirements.sh "$app"
            else
              echo "::notice::dry run, ad-hoc build: designated requirement not checked"
            fi
            # Electron fuses (forge.config.ts), read with our own script.
            node deploy/scripts/read-fuses.mjs "$app" \
              --expect RunAsNode=off --expect EnableNodeOptionsEnvironmentVariable=off \
              --expect EnableNodeCliInspectArguments=off --expect EnableEmbeddedAsarIntegrityValidation=on \
              --expect OnlyLoadAppFromAsar=on
            # Size budgets (deploy/size-budget.json): the installed app, and the Gateway inside it.
            node deploy/scripts/size-budget.mjs appMB "$app"
            node deploy/scripts/size-budget.mjs psychedMB "$app/Contents/Resources/psyched"
          done
      - name: Build the DMGs from the signed apps (make-dmg.sh signs each with the same identity)
        env:
          # The Finder window layout over the background (off by default outside CI).
          PSYCHE_DMG_LAYOUT: "1"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          for app in work/*/Psyche.app; do
            arch="$(basename "$(dirname "$app")")"
            deploy/macos/make-dmg.sh "$app" "$VERSION" "$arch" dist
          done
      - name: Lock and delete the signing keychain
        if: always()
        run: |
          # Right after the last thing that signs (the DMGs, the CLI binaries), not at the end of the job.
          # The fixed path the keychain step creates, whatever state that step reached (it may have
          # failed after create-keychain and before exporting PSYCHE_SIGN_KEYCHAIN).
          kc="$RUNNER_TEMP/signing.keychain-db"
          security lock-keychain "$kc" 2>/dev/null || true
          security delete-keychain "$kc" 2>/dev/null || true
          rm -f "$kc" "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/cert.p12"
      - name: Update zips, size checks and the CLI smoke test (the keychain is gone by now)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for app in work/*/Psyche.app; do
            arch="$(basename "$(dirname "$app")")"
            # The zip Squirrel.Mac installs from; the signed update manifest names its SHA-256. Written
            # by ditto, so it carries no quarantine flag.
            zip="dist/Psyche-${VERSION}-darwin-${arch}.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
            node deploy/scripts/size-budget.mjs dmgMB "dist/Psyche-${VERSION}-${arch}.dmg"
            node deploy/scripts/size-budget.mjs dmgMB "$zip"
          done
          # Unsigned (dry run) CLI binaries ship as built; signed ones replace them.
          mkdir -p signed-cli
          for f in unsigned/unsigned-psyche-darwin-*; do
            [ -e "$f" ] || continue
            out="signed-cli/${f#unsigned/unsigned-}"
            [ -e "$out" ] || cp "$f" "$out"
          done
          if [ -e signed-cli/psyche-darwin-arm64 ]; then
            signed-cli/psyche-darwin-arm64 version --json | grep -F "\"$VERSION\""
          fi
      - name: Upload the DMGs and update zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-desktop-signed
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
          if-no-files-found: error
      - name: Upload the macOS CLI binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-cli-macos
          path: signed-cli/psyche-darwin-*
          if-no-files-found: error

  windows:
    name: Psyche Windows x64 installer
    needs: version
    if: inputs.version_pr != true
    # Builds AND signs (Squirrel.Windows signs inside `make`; see the header), so unlike the dmg and
    # cli jobs it uses the `release` environment: the Authenticode secrets are secrets of that
    # environment and of no other job; a manual dry run uses `release-dry-run` and builds unsigned.
    # The certificate is written only after `pnpm install` and removed in an always() step.
    environment: ${{ (github.event_name == 'push' || inputs.dry_run == false) && 'release' || 'release-dry-run' }}
    # psyched bundles native addons and node.exe for the host's arch, like the DMG legs.
    runs-on: windows-latest
    timeout-minutes: 75
    # Windows is the newest platform: a pre-release ships without it when it fails to build (the
    # notes say so); a stable release needs it.
    continue-on-error: ${{ needs.version.outputs.prerelease == 'true' }}
    outputs:
      delta_base: ${{ steps.previous.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (with the Electron binary)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
        run: pnpm install --frozen-lockfile
      - name: Rust toolchain (for apps/win-helper)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Stamp the release version (the updater compares against it)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node -e 'const f="apps/desktop/package.json",fs=require("fs"),p=JSON.parse(fs.readFileSync(f));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
      - name: The previous Windows release, for a delta package (when there is one)
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=""
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --exclude-drafts --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$TAG" ] && continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx RELEASES; then
              prev="$tag"; break
            fi
          done
          if [ -z "$prev" ]; then
            echo "::notice::No earlier Windows release: this one ships the full package only."
            exit 0
          fi
          dir="$RUNNER_TEMP/squirrel-previous"
          mkdir -p "$dir"
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern RELEASES --pattern '*-full.nupkg'
          ls -la "$dir"
          echo "feed=$(cygpath -w "$dir")" >> "$GITHUB_OUTPUT"
          echo "version=${prev#v}" >> "$GITHUB_OUTPUT"
      - name: Signing certificate (when the secret exists)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "psyche-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            "WINDOWS_CERTIFICATE_FILE=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host "::notice::No WINDOWS_CERTIFICATE_BASE64 secret: Trusted Signing when its secrets exist, else unsigned."
          }
      - name: Build psyched, the helper and the installer (signed when configured)
        shell: pwsh
        env:
          PSYCHE_VERSION: ${{ needs.version.outputs.version }}
          # Leaves out the development-only fallbacks, as for the DMG (security §10).
          PSYCHE_PUBLIC_RELEASE: "1"
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PREVIOUS_FEED: ${{ steps.previous.outputs.feed }}
        run: |
          # The delta: electron-winstaller's remoteReleases (PSYCHE_SQUIRREL_REMOTE_RELEASES,
          # forge.config.ts) has Squirrel's SyncReleases fetch RELEASES and the newest full nupkg,
          # then releasify diffs against it. SyncReleases reads only http(s) (a file:// or plain path
          # fails), and a github.com URL makes it ask the API for the latest release, which may have
          # no Windows files; so the previous release's files are served on loopback for the build.
          $server = $null
          if ($env:PREVIOUS_FEED) {
            $server = Start-Process python -PassThru -WindowStyle Hidden -ArgumentList @(
              "-m", "http.server", "18765", "--bind", "127.0.0.1", "--directory", $env:PREVIOUS_FEED)
            Start-Sleep -Seconds 2
            $env:PSYCHE_SQUIRREL_REMOTE_RELEASES = "http://127.0.0.1:18765/"
          }
          try {
            # -Smoke starts the bundled Gateway once against /healthz, like --smoke for the DMG.
            ./deploy/windows/build-local.ps1 -Smoke
          } finally {
            if ($server) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "psyche-signing.pfx")
      - name: Collect the release files
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          cp "dist/Psyche-${VERSION}-Setup.exe" "dist/Psyche-${VERSION}-win32-x64.zip" release/
          # This version's packages only (build-local.ps1 leaves out the synced previous one).
          cp dist/squirrel-win32-x64/RELEASES dist/squirrel-win32-x64/*.nupkg release/
          ls -la release
          cat release/RELEASES
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, image-manifest, sandbox-image-manifest, cli, dmg, sign, windows]
    # Every needed job must succeed, except in a pre-release the DMG matrix, whose Intel leg may
    # fail (continue-on-error above; the "Desktop DMGs that shipped" step then requires arm64), and
    # the Windows installer ("Windows installer that shipped").
    if: >-
      ${{ !cancelled() && inputs.version_pr != true
      && needs.version.result == 'success' && needs.image-manifest.result == 'success'
      && needs.sandbox-image-manifest.result == 'success' && needs.cli.result == 'success'
      && needs.sign.result == 'success'
      && (needs.dmg.result == 'success' || needs.version.outputs.prerelease == 'true')
      && (needs.windows.result == 'success' || needs.version.outputs.prerelease == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The update-manifest signing key lives in "release" (required reviewers, tags only; security
    # §11). Manual dry runs use the unprotected "release-dry-run", which has no key and publishes
    # nothing, so they never wait for an approval.
    environment: ${{ (github.event_name == 'push' || inputs.dry_run == false) && 'release' || 'release-dry-run' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Only the sign job's output ships (drop every unsigned build; a publishing run must be signed)
        env:
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          rm -f artifacts/unsigned-*
          if [ "$PUBLISH" = "true" ] && [ "$SIGNED" != "true" ]; then
            echo "::error::the sign job did not sign this release"; exit 1
          fi
          ls artifacts
      - name: Desktop DMGs that shipped (Apple silicon required; Intel optional for pre-releases)
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls artifacts/Psyche-*-arm64.dmg >/dev/null 2>&1 \
            || { echo "::error::no Apple silicon DMG: nothing to release"; exit 1; }
          if ls artifacts/Psyche-*-x64.dmg >/dev/null 2>&1; then
            echo "INTEL_DMG=true" >> "$GITHUB_ENV"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "::warning::no Intel DMG; this pre-release ships Apple silicon only"
            echo "INTEL_DMG=false" >> "$GITHUB_ENV"
          else
            echo "::error::no Intel DMG: a stable release needs both"; exit 1
          fi
      - name: Windows installer that shipped (required for a stable release)
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if ls artifacts/Psyche-*-Setup.exe >/dev/null 2>&1 && [ -f artifacts/RELEASES ] \
            && ls artifacts/Psyche-*-full.nupkg >/dev/null 2>&1; then
            echo "WINDOWS=true" >> "$GITHUB_ENV"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "::warning::no Windows installer; this pre-release ships without Windows"
            echo "WINDOWS=false" >> "$GITHUB_ENV"
          else
            echo "::error::no Windows installer: a stable release needs it"; exit 1
          fi
      - name: Signed update manifest (needs RELEASE_SIGNING_KEY in the release environment)
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image-manifest.outputs.digest }}
          DELTA_BASE: ${{ needs.windows.outputs.delta_base }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::No RELEASE_SIGNING_KEY: no update manifest. Installed apps will not auto-update to this release."
            exit 0
          fi
          minimum="$(node -p 'require("./deploy/update-policy.json").minimumVersion')"
          # Windows: platforms["win32-x64"] (RELEASES, the full nupkg, the installer, and the delta
          # with the release it applies to); the macOS `artifacts` list is unchanged.
          win=()
          if [ "$WINDOWS" = "true" ]; then
            win=(--win-arch x64 artifacts/RELEASES artifacts/Psyche-*-full.nupkg artifacts/Psyche-*-Setup.exe)
            if [ -n "$DELTA_BASE" ] && ls artifacts/Psyche-*-delta.nupkg >/dev/null 2>&1; then
              win+=(--delta-base "$DELTA_BASE" artifacts/Psyche-*-delta.nupkg)
            fi
          fi
          node deploy/scripts/update-manifest.mjs build --release "$VERSION" --minimum "$minimum" \
            --base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            ${DIGEST:+--image "gateway=${IMAGE}@${DIGEST}"} \
            artifacts/Psyche-*.zip artifacts/Psyche-*.dmg "${win[@]}" > artifacts/update-manifest.json
          PSYCHE_RELEASE_SIGNING_KEY="$SIGNING_KEY" node deploy/scripts/update-manifest.mjs sign artifacts/update-manifest.json
          # Self-check against the public half of the key that just signed.
          pub="$(PSYCHE_RELEASE_SIGNING_KEY="$SIGNING_KEY" node -e 'const c=require("crypto");process.stdout.write(Buffer.from(c.createPublicKey(c.createPrivateKey(process.env.PSYCHE_RELEASE_SIGNING_KEY)).export({format:"jwk"}).x,"base64url").toString("base64"))')"
          node deploy/scripts/update-manifest.mjs verify artifacts/update-manifest.json "$pub"
          cat artifacts/update-manifest.json
      - name: Compose bundle with the Gateway image pinned by digest (#296)
        env:
          DIGEST: ${{ needs.image-manifest.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::notice::No image digest (dry run): no Compose bundle."
            exit 0
          fi
          dir="$RUNNER_TEMP/psyche-compose-${VERSION}"
          mkdir -p "$dir/tailscale" "$dir/backup"
          node deploy/scripts/render-compose.mjs deploy/docker-compose.yml "${IMAGE}:${VERSION}@${DIGEST}" > "$dir/docker-compose.yml"
          cp deploy/env.example "$dir/env.example"
          cp deploy/tailscale/serve.json "$dir/tailscale/"
          cp deploy/backup/*.sh "$dir/backup/"
          mkdir -p "$dir/browser"
          cp deploy/browser/Dockerfile deploy/browser/package.json deploy/browser/package-lock.json "$dir/browser/"
          tar -C "$RUNNER_TEMP" -czf "artifacts/psyche-compose-${VERSION}.tar.gz" "psyche-compose-${VERSION}"
          grep -n "image:" "$dir/docker-compose.yml"
      - name: SHA256SUMS and release notes
        env:
          DIGEST: ${{ needs.image-manifest.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          node deploy/scripts/release-notes.mjs . "$TAG" "${IMAGE}@${DIGEST}" > notes.md
          # The Mac app is self-signed and not notarized: say how to open it the first time.
          # A publishing run is always signed with the release certificate (the dmg job refuses
          # otherwise); a dry run is ad-hoc and its notes are never published.
          if [ "$PUBLISH" = "true" ]; then { echo; cat deploy/macos/open-anyway.md; } >> notes.md; fi
          if [ "$INTEL_DMG" = "false" ]; then
            # Under the title: the Mac app in this pre-release is Apple silicon only.
            { head -n 1 notes.md; echo
              echo "> **Mac app: Apple silicon only.** The Intel (x64) DMG did not build for this pre-release. On an Intel Mac, use the server image or the CLI, or wait for the next alpha."
              tail -n +2 notes.md; } > notes.tmp && mv notes.tmp notes.md
          fi
          if [ "$WINDOWS" = "false" ]; then
            { head -n 1 notes.md; echo
              echo "> **No Windows installer.** It did not build for this pre-release. On Windows, build it from source (docs/guides/install.md) or wait for the next alpha."
              tail -n +2 notes.md; } > notes.tmp && mv notes.tmp notes.md
          fi
      - name: Keep SHA256SUMS for the tap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: SHA256SUMS
      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Psyche $TAG" \
            --notes-file notes.md $flags SHA256SUMS artifacts/*

  homebrew:
    name: Homebrew tap
    needs: [version, release]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
      - name: Render the cask and the formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node deploy/scripts/homebrew.mjs "$VERSION" SHA256SUMS tap
          ruby -c tap/Casks/psyche.rb tap/Formula/psyche-cli.rb
          cat tap/Casks/psyche.rb tap/Formula/psyche-cli.rb
      - name: Push to the tap (needs HOMEBREW_TAP_TOKEN)
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TOKEN" ] || [ "$PUBLISH" != "true" ]; then
            echo "::notice::Not updating the tap (no HOMEBREW_TAP_TOKEN, or a dry run)."
            exit 0
          fi
          # Token through gh's credential helper, never in a URL or the remote config.
          export GH_TOKEN="$TOKEN"
          gh auth setup-git
          git clone --depth 1 "https://github.com/${OWNER}/homebrew-psyche.git" tap-repo
          mkdir -p tap-repo/Casks tap-repo/Formula
          cp tap/Casks/psyche.rb tap-repo/Casks/psyche.rb
          cp tap/Formula/psyche-cli.rb tap-repo/Formula/psyche-cli.rb
          cd tap-repo
          git config user.name "psyche-release"
          git config user.email "psyche-release@users.noreply.github.com"
          git add Casks Formula
          git commit -m "psyche ${VERSION}" || { echo "tap already at ${VERSION}"; exit 0; }
          git push origin HEAD
