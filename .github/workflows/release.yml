# Release pipeline (roadmap v1.0; docs/guides/install.md). Owner: S22.
# Runs ONLY on version tags (v*) and by hand; never on pull requests or main pushes (CI diet,
# PR #165). A manual run is a dry run unless dry_run is unticked.
#
#   Deploy smoke   image build, `docker compose up --wait`, `psyche status` in and outside the
#                  container, backup scripts round trip; gates the image push
#   Docker image   ghcr.io/<owner>/psyche-gateway:<version>, linux/amd64 + linux/arm64, SBOM and
#                  provenance, signed keyless with cosign (GitHub OIDC; signer identity
#                  .github/workflows/release.yml@refs/tags/v*)
#   CLI            psyche-{darwin,linux}-{arm64,x64} single binaries (bun --compile) with the
#                  version and the database migrations baked in (`psyche migrate --check`)
#   Desktop        Psyche-<version>-{arm64,x64}.dmg (deploy/macos/make-dmg.sh)
#   Release        GitHub release with SHA256SUMS and notes from the changesets CHANGELOGs
#   Homebrew       Casks/psyche.rb and Formula/psyche-cli.rb pushed to <owner>/homebrew-psyche
#   Version PR     manual run with version_pr: changesets opens the "Version Packages" PR
#
# Everything is unsigned unless these secrets exist (steps skip cleanly without them; never echo
# them):
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY
#       Developer ID Application certificate; signs the app, the DMG and the macOS CLI binaries
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER
#       App Store Connect API key for notarytool (notarize + staple)
#   HOMEBREW_TAP_TOKEN
#       fine-grained token with contents:write on <owner>/homebrew-psyche only
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but publish nothing (no push, no release, no tap update)"
        type: boolean
        default: true
      version_pr:
        description: "Only open or update the changesets Version Packages PR"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/psyche-gateway
  BUN_VERSION: "1.4.3"
  # Publish only for a real tag push; a manual run is a dry run unless dry_run is unticked.
  PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) version="${REF#v}" ;;
            *) version="0.0.0-dev.${GITHUB_RUN_NUMBER}" ;;
          esac
          case "$version" in *[!0-9A-Za-z.-]*) echo "::error::bad version $version"; exit 1 ;; esac
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  deploy-smoke:
    name: deploy smoke (compose)
    needs: version
    if: inputs.version_pr != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the Gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: psyche-gateway:smoke
          build-args: PSYCHE_VERSION=0.0.0-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose up and wait for /healthz
        env:
          PSYCHE_IMAGE: psyche-gateway:smoke
        run: docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 120

      - name: psyche status inside the container
        run: docker compose -f deploy/docker-compose.yml exec -T gateway psyche status --json

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: psyche status from the host (loopback, host networking)
        run: |
          pnpm install --frozen-lockfile --filter "@psyche/cli..."
          curl -fsS http://127.0.0.1:7979/healthz
          node apps/cli/src/main.ts status --json
          node apps/cli/src/main.ts doctor --offline --json || true

      - name: Image runs as non-root, read-only, no published ports
        run: |
          id=$(docker compose -f deploy/docker-compose.yml ps -q gateway)
          test "$(docker inspect -f '{{.Config.User}}' "$id")" = "10001:10001"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = "true"
          test "$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$id")" = "{}"

      - name: Backup scripts round trip
        env:
          PSYCHE_IMAGE: psyche-gateway:smoke
          PSYCHE_BACKUP_PASSPHRASE: smoke-test-passphrase-only
        run: |
          dir="$(mktemp -d)"
          sudo chown 10001:10001 "$dir" && sudo chmod 700 "$dir"
          deploy/backup/backup.sh "$dir"
          file="$(sudo ls "$dir" | grep '\.tar\.gz\.age$' | head -n1)"
          deploy/backup/verify.sh "$dir/$file"
          deploy/backup/restore.sh "$dir/$file"
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 120

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color gateway

      - name: Compose down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  changesets:
    name: version packages PR
    if: github.event_name == 'workflow_dispatch' && inputs.version_pr == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Open or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: gateway image (multi-arch, signed)
    needs: [version, deploy-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - name: Build (and push on a tag) linux/amd64 + linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PSYCHE_VERSION=${{ needs.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest (keyless, GitHub OIDC)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  cli:
    name: psyche ${{ matrix.target }}
    needs: version
    if: inputs.version_pr != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-26 }
          - { target: darwin-x64, os: macos-26 }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Bun (single-binary bundler)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the CLI's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@psyche/cli..."
      - name: Compile (version and database migrations baked in)
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          migrations="$(node deploy/scripts/migrations-manifest.mjs)"
          bun build apps/cli/src/main.ts --compile --minify \
            --target="bun-${TARGET}" \
            --define "__PSYCHE_VERSION__=\"${VERSION}\"" \
            --define "__PSYCHE_MIGRATIONS__=${migrations}" \
            --outfile "dist/psyche-${TARGET}"
      - name: Smoke test (native targets)
        if: matrix.target == 'darwin-arm64' || matrix.target == 'linux-x64'
        env:
          BIN: dist/psyche-${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          "$BIN" version --json | grep -F "\"$VERSION\""
          "$BIN" completion bash > /dev/null
          home="$(mktemp -d)"
          PSYCHE_HOME="$home" PSYCHE_PORT=1 "$BIN" migrate --check --json
      - name: Sign and notarize (macOS, when secrets exist)
        if: startsWith(matrix.target, 'darwin')
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BIN: dist/psyche-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "::notice::No signing secrets; shipping an unsigned binary."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(openssl rand -hex 16)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Bun's JIT needs these under the hardened runtime.
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-executable-page-protection</key><true/>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --options runtime --timestamp --keychain "$kc" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          if [ "$TARGET" = "darwin-arm64" ]; then "$BIN" version --json; fi
          if [ -n "$API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            echo "$API_KEY_P8" | base64 --decode > "$key"
            ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
              --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            rm -f "$key"
          fi
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-${{ matrix.target }}
          path: dist/psyche-${{ matrix.target }}
          if-no-files-found: error

  dmg:
    name: Psyche ${{ matrix.arch }} DMG
    needs: version
    if: inputs.version_pr != true
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (with the Electron binary)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
        run: pnpm install --frozen-lockfile
      - name: Signing keychain and notarization key (when secrets exist)
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "::notice::No signing secrets; building an unsigned app and DMG."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(openssl rand -hex 16)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"
          # apps/desktop/src/packaging/signing-config.ts and deploy/macos/make-dmg.sh read these.
          echo "PSYCHE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
            } >> "$GITHUB_ENV"
          fi
      - name: Package Psyche.app (signed and notarized by electron-forge when configured)
        env:
          ARCH: ${{ matrix.arch }}
        run: pnpm --filter @psyche/desktop run package --arch="$ARCH"
      - name: Build the DMG (signed, notarized and stapled when configured)
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app="$(find apps/desktop/out -maxdepth 2 -name Psyche.app -path "*darwin-${ARCH}*" | head -n1)"
          test -n "$app" || { echo "::error::no Psyche.app for $ARCH"; exit 1; }
          deploy/macos/make-dmg.sh "$app" "$VERSION" "$ARCH" dist
      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, image, cli, dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS and release notes
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          node deploy/scripts/release-notes.mjs . "$TAG" "${IMAGE}@${DIGEST}" > notes.md
      - name: Keep SHA256SUMS for the tap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: SHA256SUMS
      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Psyche $TAG" \
            --notes-file notes.md $flags SHA256SUMS artifacts/*

  homebrew:
    name: Homebrew tap
    needs: [version, release]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
      - name: Render the cask and the formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node deploy/scripts/homebrew.mjs "$VERSION" SHA256SUMS tap
          ruby -c tap/Casks/psyche.rb tap/Formula/psyche-cli.rb
          cat tap/Casks/psyche.rb tap/Formula/psyche-cli.rb
      - name: Push to the tap (needs HOMEBREW_TAP_TOKEN)
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TOKEN" ] || [ "$PUBLISH" != "true" ]; then
            echo "::notice::Not updating the tap (no HOMEBREW_TAP_TOKEN, or a dry run)."
            exit 0
          fi
          # Token through gh's credential helper, never in a URL or the remote config.
          export GH_TOKEN="$TOKEN"
          gh auth setup-git
          git clone --depth 1 "https://github.com/${OWNER}/homebrew-psyche.git" tap-repo
          mkdir -p tap-repo/Casks tap-repo/Formula
          cp tap/Casks/psyche.rb tap-repo/Casks/psyche.rb
          cp tap/Formula/psyche-cli.rb tap-repo/Formula/psyche-cli.rb
          cd tap-repo
          git config user.name "psyche-release"
          git config user.email "psyche-release@users.noreply.github.com"
          git add Casks Formula
          git commit -m "psyche ${VERSION}" || { echo "tap already at ${VERSION}"; exit 0; }
          git push origin HEAD
