# Release pipeline and deploy smoke test (S22 owns this file; deploy/README.md "Release artifacts").
#
# Pull requests touching deploy/, the CLI or the Gateway: build the image, `docker compose up
# --wait`, `psyche status` inside and outside the container.
# Pushes to main: changesets opens or updates the "Version Packages" PR (CHANGELOG.md files).
# Tags v*: multi-arch Gateway image on GHCR signed with cosign (keyless), `psyche` binaries for
# macOS arm64/x64 and Linux x64/arm64, the unsigned desktop package, and a GitHub release with
# notes from the changesets CHANGELOGs and SHA-256 sums.
#
# Optional secrets (steps are skipped when absent; never echo them):
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD  Developer ID Application cert
#   MACOS_SIGNING_IDENTITY                                    e.g. "Developer ID Application: … (TEAMID)"
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID      notarytool credentials
name: release

on:
  pull_request:
    paths:
      - "deploy/**"
      - "apps/cli/**"
      - "apps/gateway/**"
      - "packages/db/**"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/psyche-gateway
  BUN_VERSION: "1.4.3"

jobs:
  deploy-smoke:
    name: deploy smoke (compose)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the Gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: psyche-gateway:smoke
          build-args: PSYCHE_VERSION=0.0.0-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose up and wait for /healthz
        env:
          PSYCHE_IMAGE: psyche-gateway:smoke
        run: docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 120

      - name: psyche status inside the container
        run: docker compose -f deploy/docker-compose.yml exec -T gateway psyche status --json

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: psyche status from the host (loopback, host networking)
        run: |
          pnpm install --frozen-lockfile --filter "@psyche/cli..."
          curl -fsS http://127.0.0.1:7979/healthz
          node apps/cli/src/main.ts status --json
          node apps/cli/src/main.ts doctor --offline --json || true

      - name: Image runs as non-root, read-only, no published ports
        run: |
          id=$(docker compose -f deploy/docker-compose.yml ps -q gateway)
          test "$(docker inspect -f '{{.Config.User}}' "$id")" = "10001:10001"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = "true"
          test "$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$id")" = "{}"

      - name: Backup scripts round trip
        env:
          PSYCHE_IMAGE: psyche-gateway:smoke
          PSYCHE_BACKUP_PASSPHRASE: smoke-test-passphrase-only
        run: |
          dir="$(mktemp -d)"
          sudo chown 10001:10001 "$dir" && sudo chmod 700 "$dir"
          deploy/backup/backup.sh "$dir"
          file="$(sudo ls "$dir" | grep '\.tar\.gz\.age$' | head -n1)"
          deploy/backup/verify.sh "$dir/$file"
          deploy/backup/restore.sh "$dir/$file"
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 120

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color gateway

      - name: Compose down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  changesets:
    name: version packages PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Open or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: gateway image (multi-arch, signed)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push linux/amd64 + linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PSYCHE_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  cli:
    name: psyche ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-26 }
          - { target: darwin-x64, os: macos-26 }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Bun (single-binary bundler)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the CLI's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@psyche/cli..."
      - name: Compile
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bun build apps/cli/src/main.ts --compile --minify \
            --target="bun-${TARGET}" \
            --define "__PSYCHE_VERSION__=\"${VERSION}\"" \
            --outfile "dist/psyche-${TARGET}"
      - name: Smoke test (native targets)
        if: matrix.target == 'darwin-arm64' || matrix.target == 'linux-x64'
        run: |
          ./dist/psyche-${{ matrix.target }} version --json
          ./dist/psyche-${{ matrix.target }} completion bash > /dev/null
      - name: Sign and notarize (macOS, when secrets exist)
        if: startsWith(matrix.target, 'darwin')
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BIN: dist/psyche-${{ matrix.target }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "::notice::No signing secrets; shipping an unsigned binary."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(openssl rand -hex 16)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --options runtime --timestamp --keychain "$kc" --sign "$IDENTITY" "$BIN"
          if [ -n "$APPLE_ID" ]; then
            ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          fi
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-${{ matrix.target }}
          path: dist/psyche-${{ matrix.target }}
          if-no-files-found: error

  desktop:
    name: desktop package (macOS, unsigned)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (with the Electron binary)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
        run: pnpm install --frozen-lockfile
      - name: Make (unsigned; signing and notarization need the secrets listed at the top)
        id: make
        run: |
          if ! node -e "process.exit(require('./apps/desktop/package.json').scripts?.make ? 0 : 1)"; then
            echo "::notice::apps/desktop has no make script yet; skipping the desktop package."
            echo "made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm --filter @psyche/desktop make
          echo "made=true" >> "$GITHUB_OUTPUT"
      - name: Upload
        if: steps.make.outputs.made == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psyche-desktop-macos
          path: apps/desktop/out/make/**
          if-no-files-found: warn

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, cli, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from the changesets CHANGELOGs
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          node deploy/scripts/release-notes.mjs . "$TAG" "${IMAGE}@${DIGEST}" > notes.md
          cd artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Psyche $TAG" \
            --notes-file notes.md $prerelease SHA256SUMS $(find artifacts -type f)
