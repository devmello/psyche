# Builds the documentation site (apps/site, VitePress) and publishes it to GitHub Pages.
# Pushes to main only: pull requests never deploy, and nothing here runs on forks' PRs.
# Owner setting required once: Settings → Pages → Source: GitHub Actions (docs/archive/status/s20.md).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "docs/guides/**"
      - "docs/release-notes/**"
      - "apps/cli/src/**"
      - "SECURITY.md"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# One deployment at a time; a newer push waits rather than cancelling a deployment in flight.
concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  build:
    name: docs / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The site and the CLI sources its reference page is generated from.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@psyche/site..." --filter "@psyche/cli..."

      # vitepress build fails on dead links between pages; docs:check adds the repository links.
      - name: Build and check links
        run: pnpm docs:check

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/.vitepress/dist

  deploy:
    name: docs / deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
